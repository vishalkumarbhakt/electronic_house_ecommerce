{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-12">
    <div class="max-w-md mx-auto">
        <div class="bg-white rounded-xl shadow-sm p-8">
            <h1 class="text-2xl font-bold text-dark text-center mb-6">Create an Account</h1>
            
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label class="block text-gray-600 mb-1">Username</label>
                    <input 
                        type="text" 
                        name="username"
                        required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-600 mb-1">Password</label>
                    <input 
                        type="password" 
                        name="password1"
                        required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary"
                    >
                </div>
                
                <div>
                    <label class="block text-gray-600 mb-1">Confirm Password</label>
                    <input 
                        type="password" 
                        name="password2"
                        required
                        class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-primary"
                    >
                </div>
                
                <button type="submit" class="w-full bg-primary hover:bg-green-600 text-white py-3 rounded-lg font-semibold transition">
                    Register
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Already have an account? 
                    <a href="{% url 'users:login' %}" class="text-primary hover:underline">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
